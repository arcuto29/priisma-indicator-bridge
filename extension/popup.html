<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Priisma LVN Zones</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1e1e2e;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .subtitle {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #2a2a3e;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .toggle-label {
      flex: 1;
      font-weight: 500;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      background: #444;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle.active {
      background: #0096ff;
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle.active::after {
      transform: translateX(18px);
    }

    .stats {
      padding: 10px 12px;
      background: #2a2a3e;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .stat-row:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      color: #888;
    }

    .stat-value {
      font-weight: 500;
      color: #0096ff;
    }

    .status {
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
    }

    .status.connected {
      background: rgba(0, 200, 100, 0.1);
      color: #00c864;
    }

    .status.disconnected {
      background: rgba(255, 80, 80, 0.1);
      color: #ff5050;
    }

    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">Priisma LVN Zones</div>
      <div class="subtitle">NQ Low Volume Nodes</div>
    </div>
  </div>

  <div class="toggle-container">
    <span class="toggle-label">Show Zones</span>
    <div class="toggle active" id="toggle"></div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <span class="stat-label">Zones loaded</span>
      <span class="stat-value" id="zone-count">148</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Symbol</span>
      <span class="stat-value">NQ</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Range</span>
      <span class="stat-value">27193 – 30694</span>
    </div>
  </div>

  <div class="status disconnected" id="status">
    Looking for chart...
  </div>

  <div class="footer">
    Zones are fixed. They never move.
  </div>

  <script src="popup.js"></script>
</body>
</html>
